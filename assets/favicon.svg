<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#2a2421"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c86d4b"/>
      <stop offset="100%" stop-color="#a85536"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Terracotta Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.85"/>

  <!-- Stylized Luxury ST Monogram -->
  <g fill="#fcfbfa" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif">
    <text x="256" y="340" font-size="280" font-weight="700" letter-spacing="-10">S</text>
  </g>
  
  <!-- Subtle Terracotta Accent Dot -->
  <circle cx="390" cy="140" r="28" fill="url(#accentGrad)"/>
</svg>
